name: A-share bounded latency checks
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/latency-checks.yml']
  push:
    branches: ['fix/bounded-close-20261015']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_analytics.py && python tests/test_collection.py && python tests/test_provider_pages.py
      - name: Live collection timing (after-hours is not intraday acceptance)
        env:
          ASH_FAST_MODE: '1'
        run: |
          python scripts/run_snapshot.py --session close --skip-wait
          python - <<'PY'
          import json
          s = json.load(open('data/latest_close.json'))
          m = s['meta']
          print(json.dumps(m, ensure_ascii=False, indent=2))
          assert m.get('collection_elapsed_seconds', 999) < 100
          assert all(m['source_status'][k].get('ok') for k in ('a_share_spot', 'indices'))
          PY
