name: A-share Smoke Test
# rerun-v2: tencent-normalization-and-ths-fallback

on:
  push:
    paths:
      - ".github/workflows/smoke-test.yml"
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python tests/test_analytics.py
          python -m unittest discover -s tests -v

      - name: Fetch current A-share snapshot
        env:
          TZ: Asia/Shanghai
          ASH_FAST_MODE: "1"
        run: python scripts/run_snapshot.py --session close --skip-wait

      # Diagnostic runs may execute after trading hours: never push their
      # out-of-window results into the official noon/close histories.
      - name: Verify actual diagnostic data and official-file isolation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from a_share_monitor.calendar import is_trading_day
          day = datetime.now(ZoneInfo('Asia/Shanghai')).date()
          if not is_trading_day(day)[0]:
              print('Non-trading day: live provider acceptance skipped explicitly')
              sys.exit(0)
          s = json.loads(Path('diagnostics/latest_close.json').read_text())
          m = s['meta']
          assert m['date'] == day.isoformat(), m
          assert m['status'] in ('ok', 'partial'), m
          assert all(m['source_status'][k].get('ok') for k in ('a_share_spot', 'indices')), m
          assert m['collection_elapsed_seconds'] < 100, m
          indices = s['market']['indices']
          assert {r['code'] for r in indices} == {'000001', '399001', '399006', '000688'}, indices
          assert all(r['price'] > 0 and r['pct'] is not None for r in indices), indices
          assert s['market']['breadth']['total_valid'] >= 1000
          assert s['market']['turnover']['current'] > 0
          print(json.dumps({'status': m['status'], 'date': m['date'],
              'collection_seconds': m['collection_elapsed_seconds'],
              'sources': m['source_status'], 'indices': indices,
              'breadth': s['market']['breadth'], 'turnover': s['market']['turnover']}, ensure_ascii=False))
          PY
          git diff --exit-code -- data reports

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-diagnostic-${{ github.run_id }}
          path: diagnostics/*.json
          if-no-files-found: warn
          retention-days: 7
