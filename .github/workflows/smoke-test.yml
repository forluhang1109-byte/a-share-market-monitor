name: A-share Smoke Test

on:
  push:
    paths:
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python tests/test_analytics.py

      - name: Fetch current A-share snapshot
        env:
          TZ: Asia/Shanghai
        run: python scripts/run_snapshot.py --session close --skip-wait

      - name: Commit generated data
        run: |
          git config user.name "a-share-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "test: live market snapshot"
            git pull --rebase
            git push
          fi
