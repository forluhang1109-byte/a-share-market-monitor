name: A-share Smoke Test
# rerun-v2: tencent-normalization-and-ths-fallback

on:
  push:
    paths:
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python tests/test_analytics.py

      - name: Fetch current A-share snapshot
        env:
          TZ: Asia/Shanghai
        run: python scripts/run_snapshot.py --session close --skip-wait

      # Diagnostic runs may execute after trading hours: never push their
      # out-of-window results into the official noon/close histories.
