name: A-share 14-40 Snapshot

on:
  workflow_dispatch:
  schedule:
    # 06:30 UTC = 14:30 Asia/Shanghai, Mon-Fri
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-close
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 14:40 pre-close snapshot
        env:
          TZ: Asia/Shanghai
        run: python scripts/run_snapshot.py --session close --not-before 14:36 --max-wait-minutes 15

      - name: Commit generated data
        run: |
          git config user.name "a-share-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: close snapshot $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git pull --rebase
            git push
          fi
