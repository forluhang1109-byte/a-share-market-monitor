name: A-share 14-40 Snapshot

on:
  workflow_dispatch:
  schedule:
    # 05:50 UTC = 13:50 Beijing; prewarm before collection at 14:40. GitHub schedules are best-effort.
    - cron: "50 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-close
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 14:40 pre-close snapshot
        env:
          TZ: Asia/Shanghai
          ASH_FAST_MODE: "1"
        run: python scripts/run_snapshot.py --session close --not-before 14:40 --max-wait-minutes 55

      - name: Commit generated data
        run: |
          git config user.name "a-share-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: close snapshot $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git pull --rebase
            git push
          fi

