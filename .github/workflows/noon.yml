name: A-share Noon Snapshot

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule is best-effort; backups may be late too.
    # Beijing: 10:55, 11:10, 11:25, 11:31. Enforce 11:31-11:41.
    - cron: "55 2 * * 1-5"
    - cron: "10 3 * * 1-5"
    - cron: "25 3 * * 1-5"
    - cron: "31 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-noon
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build noon snapshot
        env:
          TZ: Asia/Shanghai
        run: python scripts/run_snapshot.py --session noon --not-before 11:31 --max-wait-minutes 40

      - name: Commit generated data
        run: |
          git config user.name "a-share-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: noon snapshot $(TZ=Asia/Shanghai date '+%F %H:%M')"
            git pull --rebase
            git push
          fi
